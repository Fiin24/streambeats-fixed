<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stream Beats" />
    <meta name="application-name" content="Stream Beats" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Platform streaming musik modern gratis tanpa iklan" />
    <link rel="preconnect" href="https://yt3.googleusercontent.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <title>Stream Beats</title>
    <style>
      /* Layar pembuka (splash) — tampil seketika sebelum JavaScript dimuat, lalu memudar */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: #000; color: #fff;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity .5s ease, transform .5s ease, visibility .5s; }
      #splash.sb-hide { opacity: 0; transform: scale(1.06); visibility: hidden; pointer-events: none; }
      .sb-logo { position: relative; width: 112px; height: 112px; display: grid; place-items: center; animation: sb-pop .7s cubic-bezier(.2,.9,.3,1.3) both; }
      .sb-logo svg { width: 84px; height: 84px;  }
      .sb-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(250,36,60,.55); animation: sb-pulse 1.8s ease-out infinite; }
      .sb-ring.r2 { animation-delay: .6s; } .sb-ring.r3 { animation-delay: 1.2s; }
      .sb-orbit { position: absolute; inset: -10px; border-radius: 50%; border: 3px solid transparent; border-top-color: #FA243C; border-right-color: rgba(250,36,60,.35); animation: sb-spin 1.1s linear infinite; }
      .sb-bar { transform-box: fill-box; transform-origin: 50% 100%; animation: sb-eq .9s ease-in-out infinite; }
      .sb-bar.b2 { animation-delay: .15s; } .sb-bar.b3 { animation-delay: .3s; } .sb-bar.b4 { animation-delay: .45s; }
      .sb-title { font-size: 26px; font-weight: 800; letter-spacing: -.02em; color: #fff; animation: sb-up .6s .15s ease both; }
      .sb-sub { margin-top: -18px; font-size: 13px; color: rgba(255,255,255,.55); letter-spacing: .02em; animation: sb-up .6s .3s ease both; }
      .sb-eq { display: flex; align-items: flex-end; gap: 5px; height: 26px; animation: sb-up .6s .4s ease both; }
      .sb-eq i { display: block; width: 5px; height: 100%; border-radius: 3px; background: linear-gradient(#FA243C, #ff7a59); transform-origin: 50% 100%; animation: sb-eq 1s ease-in-out infinite; }
      .sb-eq i:nth-child(2) { animation-delay: .12s } .sb-eq i:nth-child(3) { animation-delay: .24s } .sb-eq i:nth-child(4) { animation-delay: .36s }
      .sb-eq i:nth-child(5) { animation-delay: .48s } .sb-eq i:nth-child(6) { animation-delay: .6s } .sb-eq i:nth-child(7) { animation-delay: .72s }
      .sb-progress { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 56px); width: min(220px, 60vw); height: 3px; transform: translateX(-50%);
        border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
      .sb-progress::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, transparent, #FA243C, transparent); animation: sb-load 1.3s ease-in-out infinite; }
      @keyframes sb-spin { to { transform: rotate(360deg) } }
      @keyframes sb-pulse { 0% { transform: scale(.85); opacity: .9 } 100% { transform: scale(1.7); opacity: 0 } }
      @keyframes sb-eq { 0%, 100% { transform: scaleY(.25) } 50% { transform: scaleY(1) } }
      @keyframes sb-shine { to { background-position: -150% 0 } }
      @keyframes sb-pop { from { transform: scale(.5); opacity: 0 } to { transform: scale(1); opacity: 1 } }
      @keyframes sb-up { from { transform: translateY(10px); opacity: 0 } to { transform: none; opacity: 1 } }
      @keyframes sb-load { 0% { transform: translateX(-100%) } 100% { transform: translateX(250%) } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash *::before, #splash *::after { animation-duration: 3s !important; } }
    </style>
  </head>
  <body class="bg-black">
    <div id="splash" role="status" aria-label="Memuat Stream Beats">
      <div class="sb-logo">
        
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="31" fill="#000" stroke="#fff" stroke-width="2" />
          <path d="M16 36v-4a16 16 0 0 1 32 0v4" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" />
          <rect x="13" y="34" width="9" height="13" rx="3" fill="#fff" />
          <rect x="42" y="34" width="9" height="13" rx="3" fill="#fff" />
          <g stroke="#FA243C" stroke-width="2.5" stroke-linecap="round">
            <path class="sb-bar" d="M26 41v-6" /><path class="sb-bar b2" d="M30 43v-10" /><path class="sb-bar b3" d="M34 43v-10" /><path class="sb-bar b4" d="M38 41v-6" />
          </g>
        </svg>
      </div>
      <div class="sb-title">Stream Beats</div>
      <div class="sb-sub">Musik gratis tanpa iklan</div>
      <div class="sb-eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="sb-progress" aria-hidden="true"></div>
    </div>
    <script>
      // pengaman: bila aplikasi gagal dimuat, splash tetap hilang setelah 15 detik
      setTimeout(function () { var s = document.getElementById('splash'); if (s) s.classList.add('sb-hide'); }, 15000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
